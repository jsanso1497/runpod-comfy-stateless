name: Build SAM-Guided Local Edit
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate approved graph and minimal catalog
        run: python scripts/validate_sam_local_edit.py
      - name: Derive container name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish approved-only image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sam-local-edit
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:qwen-local-edit-v1
            ${{ steps.image.outputs.name }}:qwen-local-edit-${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record actual published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          record = {'profile': 'approved-local-edit-1', 'commit': os.environ['COMMIT'],
                    'image': os.environ['IMAGE'], 'digest': os.environ['DIGEST'],
                    'image_reference': os.environ['IMAGE'] + '@' + os.environ['DIGEST'],
                    'tag': os.environ['IMAGE'] + ':qwen-local-edit-v1', 'gpu_tested': False}
          open('published-local-edit-image.json', 'w').write(json.dumps(record, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## SAM-Guided Local Edit\n\n`' + record['tag'] + '`\n\nExact image: `' + record['image_reference'] + '`\n\nSoftware published. GPU results are not certified.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: published-sam-local-edit-image
          path: published-local-edit-image.json
