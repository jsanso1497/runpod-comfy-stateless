name: Build Qwen Photo + Native + Torso (Unified)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'qwen21_photo_edit/**'
      - 'qwen21_native/**'
      - 'qwen21_unified/**'
      - '.github/workflows/build-qwen21-unified.yml'
  pull_request:
    paths:
      - 'qwen21_photo_edit/**'
      - 'qwen21_native/**'
      - 'qwen21_unified/**'
      - '.github/workflows/build-qwen21-unified.yml'

permissions:
  contents: read

concurrency:
  group: qwen21-unified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check original Photo, native, torso, and generated Dockerfile (no GPU/Torch needed)
        run: |
          set -Eeuo pipefail
          if test -f tools/verify_snapshot.py; then python tools/verify_snapshot.py; fi
          python qwen21_photo_edit/ci_validate.py
          python qwen21_unified/scripts/verify_bundle.py --repo .
          python qwen21_native/scripts/validate_workflows.py --profile upscale --include-bfs
          python qwen21_native/addons/torso_lock/scripts/validate_workflows.py
          python qwen21_unified/scripts/generate_dockerfile.py --repo . --check
          python -m compileall -q qwen21_unified/scripts qwen21_native/scripts qwen21_native/custom_nodes qwen21_native/addons/torso_lock
          bash -n qwen21_unified/scripts/entry.sh
          python -m unittest discover -s qwen21_unified/tests -p 'test_*.py' -v
  build:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused GitHub runner build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase GHCR name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/runpod-comfy-qwen21-photo" >> "$GITHUB_OUTPUT"
      - name: Build and publish unified image (weights downloaded only on Pod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./qwen21_photo_edit/Dockerfile.unified
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:unified
            ${{ steps.image.outputs.name }}:unified-v2.1.2
            ${{ steps.image.outputs.name }}:unified-sha-${{ github.sha }}
          cache-from: type=gha,scope=qwen21-photo-unified
          cache-to: type=gha,mode=min,scope=qwen21-photo-unified
