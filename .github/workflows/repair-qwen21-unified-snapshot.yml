name: Repair Qwen Unified Source Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: qwen21-unified-snapshot-maintenance
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate missing Photo-derived unified Dockerfile safely
        run: |
          set -Eeuo pipefail
          if test -f qwen21_photo_edit/Dockerfile.unified; then
            python qwen21_unified/scripts/generate_dockerfile.py --repo . --check
          else
            python qwen21_unified/scripts/generate_dockerfile.py --repo .
          fi
      - name: Verify manifest repair against alternate snapshot layouts
        run: |
          set -Eeuo pipefail
          if ! python -m unittest discover -s qwen21_unified/tests -p test_repair_snapshot.py -q > /tmp/qwen-snapshot-tests.log 2>&1; then
            cat /tmp/qwen-snapshot-tests.log
            exit 1
          fi
          tail -n 3 /tmp/qwen-snapshot-tests.log
      - name: Audit unified package and propose snapshot-only updates
        run: |
          set -Eeuo pipefail
          python qwen21_unified/scripts/repair_source_snapshot.py --repo .
      - name: Register verified unified sources and run original snapshot verifier
        run: |
          set -Eeuo pipefail
          python qwen21_unified/scripts/repair_source_snapshot.py --repo . --write
          python qwen21_unified/scripts/verify_bundle.py --repo .
          python qwen21_native/scripts/validate_workflows.py --profile upscale --include-bfs
          python qwen21_native/addons/torso_lock/scripts/validate_workflows.py
      - name: Commit verified manifest and generated unified Dockerfile
        run: |
          set -Eeuo pipefail
          git add -- SOURCE_SNAPSHOT.json qwen21_photo_edit/Dockerfile.unified
          if git diff --cached --quiet; then
            echo "Verified manifest and unified Dockerfile already committed; no update needed"
            exit 0
          fi
          git diff --cached --name-only
          # No source code, weights, workflows, or other paths are permitted in this commit.
          while IFS= read -r path; do
            case "$path" in
              SOURCE_SNAPSHOT.json|qwen21_photo_edit/Dockerfile.unified) ;;
              *) echo "Refusing to commit unrelated file: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair unified source snapshot and Dockerfile [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
