name: Validate repository
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install pytest numpy scipy pillow requests filelock aiohttp pyyaml
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build pinned developer workflows (no model weights)
        run: python scripts/build_identity_workflows.py
      - run: python scripts/build_krea_workflow.py
      - run: python scripts/build_site.py
      - run: python scripts/validate.py
      - run: PYTHONPATH=src pytest -q tests
      - run: node tests/test_configurator.cjs
      - run: python -m compileall -q src deploy scripts
      - run: git diff --exit-code site/index.html site/catalog.json workflows/krea/K01 automation/K01
      - name: Export developer workflow JSON and provenance
        uses: actions/upload-artifact@v4
        with:
          name: identity-developer-workflows
          path: |
            workflows/developer/
            vendor/identity/
