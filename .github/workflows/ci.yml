name: Validate repository
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install pytest numpy scipy pillow requests filelock aiohttp pyyaml
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build pinned developer workflows (no model weights)
        run: python scripts/build_identity_workflows.py
      - run: python scripts/build_krea_workflow.py
      - run: python scripts/build_site.py
      - run: python scripts/validate.py
      - run: PYTHONPATH=src pytest -q tests
      - run: node tests/test_configurator.cjs
      - run: python -m compileall -q src deploy scripts
      - name: Verify reproducible generated catalog and native Qwen workflows
        run: |
          sha256sum site/index.html site/catalog.json workflows/qwen/QNATIVE/*.json workflows/qwen/QOVERLAY/*.json workflows/experimental/moss/QMOSS/*.json workflows/experimental/moss/QMOSS_I2I/*.json > /tmp/workbench-generated.sha256
          python scripts/build_site.py
          sha256sum --check /tmp/workbench-generated.sha256
          git diff --exit-code workflows/krea/K01 automation/K01
      - name: Export developer workflow JSON and provenance
        uses: actions/upload-artifact@v4
        with:
          name: identity-developer-workflows
          path: |
            workflows/developer/
            vendor/identity/
      - name: Export native Qwen workflow JSON and provenance
        uses: actions/upload-artifact@v4
        with:
          name: qwen-stock-and-full-resolution-overlay
          path: |
            workflows/qwen/QNATIVE/
            workflows/qwen/QOVERLAY/
            vendor/qwen-stock/
            docs/QWEN_NATIVE_OVERLAY.md
      - name: Export MOSS workflows and source provenance
        uses: actions/upload-artifact@v4
        with:
          name: moss-workflows
          path: |
            workflows/experimental/moss/QMOSS/
            workflows/experimental/moss/QMOSS_I2I/
            vendor/moss-stock/
            docs/MOSS_IN_QWEN.md
