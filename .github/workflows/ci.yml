name: Validate repository
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install pytest numpy scipy pillow requests filelock aiohttp pyyaml
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python scripts/build_site.py
      - run: python scripts/validate.py
      - run: PYTHONPATH=src pytest -q
      - run: node tests/test_configurator.cjs
      - run: python -m compileall -q src deploy scripts
      - run: git diff --exit-code site/index.html site/catalog.json
