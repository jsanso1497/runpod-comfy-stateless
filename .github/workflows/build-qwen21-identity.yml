name: Build isolated Qwen 2.1 Identity
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'qwen21_identity/**'
      - '.github/workflows/build-qwen21-identity.yml'
  pull_request:
    paths:
      - 'qwen21_identity/**'
      - '.github/workflows/build-qwen21-identity.yml'
permissions:
  contents: read
concurrency:
  group: qwen21-identity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate package without downloading weights
        run: |
          python -m compileall -q qwen21_identity/scripts qwen21_identity/custom_nodes
          python qwen21_identity/scripts/validate_workflows.py --profile upscale
          bash -n qwen21_identity/scripts/start.sh qwen21_identity/scripts/build_smoke.sh
          python -m pip install pytest requests
          python -m pytest qwen21_identity/tests/test_downloader.py -q
  build:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: identity
            tag: qwen21-identity-bf16
          - profile: upscale
            tag: qwen21-identity-upscale
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused toolchain space on the disposable build runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image repository
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build, CPU schema-check, then publish dedicated tag
        uses: docker/build-push-action@v6
        with:
          context: ./qwen21_identity
          platforms: linux/amd64
          push: true
          build-args: PROFILE=${{ matrix.profile }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ matrix.tag }}
            ${{ steps.image.outputs.name }}:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha,scope=qwen21-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=qwen21-${{ matrix.profile }}
