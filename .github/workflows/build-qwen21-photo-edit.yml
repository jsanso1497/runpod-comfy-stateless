name: Build isolated Qwen 2.1 Photo Edit + SAM 3.1
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'qwen21_photo_edit/**'
      - '.github/workflows/build-qwen21-photo-edit.yml'
  pull_request:
    paths:
      - 'qwen21_photo_edit/**'
      - '.github/workflows/build-qwen21-photo-edit.yml'
permissions:
  contents: read
concurrency:
  group: qwen21-photo-edit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check snapshot, self-contained workflows, and shell syntax
        run: |
          set -Eeuo pipefail
          python tools/verify_snapshot.py
          python qwen21_photo_edit/ci_validate.py
          python -m compileall -q qwen21_photo_edit
          bash -n qwen21_photo_edit/start.sh qwen21_photo_edit/install.sh
  build:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/runpod-comfy-qwen21-photo" >> "$GITHUB_OUTPUT"
      - name: Build and publish isolated Qwen Photo image (weights are runtime downloads)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./qwen21_photo_edit/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=qwen21-photo-edit
          cache-to: type=gha,mode=max,scope=qwen21-photo-edit
