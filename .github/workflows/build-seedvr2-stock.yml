name: Build SeedVR2 Stock FP16
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: seedvr2-stock-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate the two stock workflows
        run: python3 seedvr2_stock/validate.py
      - name: Make space for the CUDA image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build, check stock media I/O, and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./seedvr2_stock
          file: ./seedvr2_stock/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:seedvr2-stock-fp16
            ${{ steps.image.outputs.name }}:seedvr2-stock-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
      - name: RunPod image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '## SeedVR2 Stock FP16'
            echo 'Use this exact image in RunPod:'
            echo '```text'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo 'Expose HTTP 8188. Set COMFY_PASSWORD. Username: workbench.'
            echo 'No Qwen, custom restoration nodes, or model weights are included in this image.'
            echo 'The two FP16 weights download on first Run and persist under /workspace/models/SEEDVR2.'
            echo 'CPU media checks are not a CUDA inference or visual-quality test.'
          } >> "$GITHUB_STEP_SUMMARY"
