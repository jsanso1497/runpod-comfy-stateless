name: Build HQ workspace
on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Workspace image to build
        required: true
        default: qwen
        type: choice
        options: [qwen, flux, h3, restoration, all]
permissions:
  contents: read
  packages: write
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          SELECTION: ${{ inputs.workspace }}
        run: |
          if [ "$SELECTION" = all ]; then
            echo 'matrix=["qwen","flux","h3","restoration"]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"$SELECTION\"]" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/build_site.py
      - run: python scripts/validate.py --no-imports
      - name: Repository image name
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Reclaim optional runner software
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build pinned HQ software and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: WB_WORKSPACE=${{ matrix.workspace }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ matrix.workspace }}-hq
            ${{ steps.name.outputs.image }}:${{ matrix.workspace }}-${{ github.sha }}
          provenance: true
          sbom: true
      - name: Publish actual image reference
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          WORKSPACE: ${{ matrix.workspace }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json,os
          record={k.lower():os.environ[k] for k in ['IMAGE','WORKSPACE','DIGEST','COMMIT']}
          record['image_reference']=record['image']+'@'+record['digest']
          record['gpu_tested']=False
          open('published-image.json','w').write(json.dumps(record,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## '+record['workspace']+' HQ\n\n`'+record['image_reference']+'`\n\nSoftware build succeeded. GPU execution and image quality are not certified.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.workspace }}
          path: published-image.json
