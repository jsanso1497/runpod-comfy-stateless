name: Build Qwen 2.1 Native Suite
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'qwen21_native/**'
      - '.github/workflows/build-qwen21-native.yml'
  pull_request:
    paths:
      - 'qwen21_native/**'
      - '.github/workflows/build-qwen21-native.yml'
permissions:
  contents: read
concurrency:
  group: qwen21-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate native suite without importing PyTorch
        run: |
          python -m pip install pytest requests pyyaml
          python -m compileall -q qwen21_native/scripts qwen21_native/custom_nodes
          python qwen21_native/scripts/build_workflows.py
          git diff --exit-code -- qwen21_native/workflows qwen21_native/api_workflows qwen21_native/config/workflow_catalog.json
          python qwen21_native/scripts/validate_workflows.py --profile upscale --include-bfs
          bash -n qwen21_native/scripts/start.sh
          python -m pytest qwen21_native/tests/test_downloader.py qwen21_native/tests/test_seedvr2_cpu_schema_patch.py qwen21_native/tests/test_static.py -q
  build:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: identity
            tag: qwen21-native-bf16
          - profile: upscale
            tag: qwen21-native-upscale
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused build-runner toolchains
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image repository
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and publish native image, full tests inside Torch environment
        uses: docker/build-push-action@v6
        with:
          context: ./qwen21_native
          platforms: linux/amd64
          push: true
          build-args: PROFILE=${{ matrix.profile }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ matrix.tag }}
            ${{ steps.image.outputs.name }}:${{ matrix.tag }}-v1.1.0
            ${{ steps.image.outputs.name }}:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha,scope=qwen21-native-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=qwen21-native-${{ matrix.profile }}
