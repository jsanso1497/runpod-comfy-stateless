# Standard Nginx reverse proxy. No Python gateway or cookie-auth service.
user www-data;
worker_processes 2;
pid /run/seedvr2-stock-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8188;
        server_tokens off;
        client_max_body_size 16g;
        client_body_timeout 3600s;
        auth_basic "SeedVR2";
        auth_basic_user_file /run/seedvr2-stock.htpasswd;
        location / {
            proxy_pass http://127.0.0.1:8189;
            proxy_http_version 1.1;
            # Startup substitutes only this directive using RUNPOD_POD_ID.
            # This avoids loopback Host/public Origin mismatches without disabling core checks.
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
